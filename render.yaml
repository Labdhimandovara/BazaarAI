services:
  - type: web
    name: bazaar-ai
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma db push --accept-data-loss && npx prisma db seed && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: AI_PROVIDER
        value: gemini
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
